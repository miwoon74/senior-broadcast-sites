<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Page not found · ページが見つかりません · 페이지를 찾을 수 없습니다</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<div class="shell layout-root">
  <main class="main"><div class="wrap gate">
    <h1 class="gate-title">404</h1>
    <p class="gate-sub">Page not found · ページが見つかりません · 페이지를 찾을 수 없습니다</p>
    <ul class="gate-list">
      {% for s in sites %}<li><a class="gate-card" lang="{{ s.lang }}" href="./{{ s.base }}/"><span class="gate-name">{{ s.name }}</span></a></li>{% endfor %}
    </ul>
  </div></main>
</div>
</body>
</html>
