{% extends "base.html" %}
{% block jsonld %}{% if org %}
<script type="application/ld+json">
{{ {"@context": "https://schema.org", "@type": "AboutPage" if nav == 'about' else "WebPage", "name": page.title,
    "url": canonical, "inLanguage": site.lang, "isPartOf": {"@id": org.home ~ "#website"},
    "about": {"@id": org.id} if nav == 'about' else none} | ld }}
</script>
{% endif %}{% endblock %}
{% block main %}
<div class="wrap">
  <article class="story static-page">
    <header class="story-head"><h1 class="story-title">{{ page.title | tt }}</h1></header>
    <div class="prose">{{ page.body_html | safe }}</div>
    <p class="contact">✉ <span class="contact-mail">{{ site.contact_email }}</span></p>
  </article>
</div>
{% endblock %}
